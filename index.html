  <style>
    /* Нативное поведение прокрутки и тапов на iOS */
    html, body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    /* Безопасные отступы для iPhone (Dynamic Island / чёлка и нижняя полоса) */
    .safe-top {
      padding-top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
    }
    .safe-bottom {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
    }
    .safe-modal-bottom {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
    }

    /* Табличные цифры для ровного выравнивания сумм */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Скрытие скроллбаров в горизонтальных чипсах */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Плавные анимации экранов и модальных окон */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(28px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes viewEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeIn 0.2s ease-out; }
    .animate-slide-up { animation: slideUp 0.26s cubic-bezier(0.22, 1, 0.36, 1); }
    .animate-view { animation: viewEnter 0.22s cubic-bezier(0.22, 1, 0.36, 1); }

    /* Скрываем стандартные стрелки у number-полей */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="date"] {
      -webkit-appearance: none;
      min-height: 2.5rem;
    }
  </style>

<body class="min-h-[100dvh] bg-ios-bg dark:bg-ios-darkBg text-neutral-900 dark:text-neutral-100 font-sans transition-colors duration-200 selection:bg-ios-blue/20">

  <!-- Корневой контейнер приложения -->
  <div id="appRoot" class="w-full max-w-lg mx-auto min-h-[100dvh] flex flex-col">
    <!-- Динамически рендерится скриптом -->
  </div>

  <!-- Контейнер модальных окон (Bottom Sheet / Dialog) -->
  <div id="modalContainer" class="fixed inset-0 z-50 hidden"></div>

  <!-- Всплывающее уведомление (Toast) -->
  <div
    id="toast"
    role="status"
    aria-live="polite"
    class="fixed bottom-8 left-1/2 -translate-x-1/2 translate-y-24 opacity-0 pointer-events-none z-[70] px-4 py-2.5 rounded-2xl bg-neutral-900/95 dark:bg-white/95 text-white dark:text-neutral-900 text-sm font-medium shadow-xl backdrop-blur-md transition-all duration-300 max-w-[90vw] text-center"
  >
    Готово
  </div>

  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 1. КОНСТАНТЫ И ХРАНИЛИЩЕ
      // =========================================================================
      const STORAGE_KEY = 'debt_tracker_kz_v1';
      const THEME_KEY = 'debt_tracker_theme_v1';

      // =========================================================================
      // 2. УТИЛИТЫ ДАТ (СТРОГО UTC, БЕЗ БАГОВ ЧАСОВЫХ ПОЯСОВ)
      // =========================================================================

      /**
       * Возвращает сегодняшнюю локальную дату в формате YYYY-MM-DD
       */
      function getTodayStr() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      /**
       * Парсит строку YYYY-MM-DD в UTC timestamp (мс)
       */
      function parseDateUTC(dateStr) {
        if (!dateStr || typeof dateStr !== 'string') return 0;
        const parts = dateStr.split('-').map(Number);
        if (parts.length !== 3 || parts.some(isNaN)) return 0;
        return Date.UTC(parts[0], parts[1] - 1, parts[2]);
      }

      /**
       * Форматирует UTC timestamp обратно в YYYY-MM-DD
       */
      function formatUTCDate(ms) {
        const d = new Date(ms);
        const y = d.getUTCFullYear();
        const m = String(d.getUTCMonth() + 1).padStart(2, '0');
        const day = String(d.getUTCDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      /**
       * Разница в календарных днях (d2 - d1)
       */
      function diffDays(d1Str, d2Str) {
        const ms1 = parseDateUTC(d1Str);
        const ms2 = parseDateUTC(d2Str);
        return Math.round((ms2 - ms1) / 86400000);
      }

      /**
       * Количество дней в конкретном месяце (month: 1..12)
       */
      function daysInMonth(year, month) {
        return new Date(Date.UTC(year, month, 0)).getUTCDate();
      }

      /**
       * Добавляет N месяцев к дате YYYY-MM-DD, сохраняя целевой день месяца
       */
      function addMonthsPreserveDay(dateStr, monthsToAdd, targetDay) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dayToUse = targetDay || d;
        const totalMonths = (y * 12 + (m - 1)) + monthsToAdd;
        const newYear = Math.floor(totalMonths / 12);
        const newMonth = (totalMonths % 12) + 1;
        const clampedDay = Math.min(dayToUse, daysInMonth(newYear, newMonth));
        return `${newYear}-${String(newMonth).padStart(2, '0')}-${String(clampedDay).padStart(2, '0')}`;
      }

      /**
       * Красивое форматирование даты по-русски: "10 июн 2025" или "24 ноя"
       */
      const MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
      const MONTHS_FULL = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

      function formatDateRu(dateStr, withYear = true) {
        if (!dateStr) return '—';
        const parts = dateStr.split('-').map(Number);
        if (parts.length !== 3) return dateStr;
        const [y, m, d] = parts;
        const mName = MONTHS_SHORT[m - 1] || '';
        return withYear ? `${d} ${mName} ${y}` : `${d} ${mName}`;
      }

      function formatMonthYearRu(dateStr) {
        if (!dateStr) return '—';
        const [y, m] = dateStr.split('-').map(Number);
        return `${MONTHS_FULL[m - 1]} ${y}`;
      }

      // =========================================================================
      // 3. ФОРМАТИРОВАНИЕ ЧИСЕЛ И ВАЛЮТЫ (ТЕНГЕ ₸)
      // =========================================================================

      function round2(num) {
        return Math.round((Number(num) + Number.EPSILON) * 100) / 100;
      }

      const moneyIntFmt = new Intl.NumberFormat('ru-RU', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0,
      });

      const moneyDecFmt = new Intl.NumberFormat('ru-RU', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });

      const moneySmartFmt = new Intl.NumberFormat('ru-RU', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2,
      });

      /**
       * Форматирует сумму в тенге: если есть тиыны (и forceInt = false), показывает их
       */
      function formatTenge(amount, opts = {}) {
        const val = Number(amount) || 0;
        const { forceDecimals = false, forceInt = false, withSign = false } = opts;
        const absVal = Math.abs(val);
        let formatted;
        if (forceInt) {
          formatted = moneyIntFmt.format(Math.round(absVal));
        } else if (forceDecimals) {
          formatted = moneyDecFmt.format(absVal);
        } else {
          // Показываем 2 знака, если есть дробная часть
          const hasFraction = Math.abs(absVal - Math.round(absVal)) > 0.004;
          formatted = hasFraction ? moneyDecFmt.format(absVal) : moneyIntFmt.format(Math.round(absVal));
        }
        const sign = val < 0 ? '−' : (withSign && val > 0 ? '+' : '');
        return `${sign}${formatted} ₸`;
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function generateId() {
        return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      function pluralMonths(n) {
        const abs = Math.abs(Math.round(n));
        const mod10 = abs % 10;
        const mod100 = abs % 100;
        if (mod10 === 1 && mod100 !== 11) return `${abs} мес.`;
        return `${abs} мес.`;
      }

      function pluralDays(n) {
        const abs = Math.abs(Math.round(n));
        const mod10 = abs % 10;
        const mod100 = abs % 100;
        if (mod10 === 1 && mod100 !== 11) return `${abs} день`;
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return `${abs} дня`;
        return `${abs} дней`;
      }

      // =========================================================================
      // 4. БАНКОВСКАЯ МАТЕМАТИКА КРЕДИТА (ACTUAL/365 + ДОСРОЧКИ)
      // =========================================================================

      /**
       * Классическая формула аннуитетного платежа
       */
      function calcAnnuity(principal, annualRate, months) {
        if (months <= 0) return round2(principal);
        if (annualRate <= 0) return round2(principal / months);
        const r = annualRate / 100 / 12;
        const pow = Math.pow(1 + r, months);
        return round2(principal * (r * pow) / (pow - 1));
      }

      /**
       * Генерирует полный хронологический график кредита с учётом:
       * - фактической даты выдачи и неполного первого периода
       * - опционального точного первого платежа (как в банке)
       * - досрочных погашений (с уменьшением срока или уменьшением платежа)
       * - ежедневного начисления процентов Actual/365
       */
      function buildCreditSchedule(credit, extraEarlyPayment = null) {
        const amount = Number(credit.amount) || 0;
        const rate = Number(credit.rate) || 0;
        const termMonths = Math.max(1, parseInt(credit.termMonths, 10) || 12);
        const issueDate = credit.issueDate;
        const firstPaymentDate = credit.firstPaymentDate;
        const customFirst = credit.customFirstPayment ? Number(credit.customFirstPayment) : null;

        const baseAnnuity = calcAnnuity(amount, rate, termMonths);
        const paymentDay = parseInt(firstPaymentDate.split('-')[2], 10) || 1;

        // Список плановых дат платежей
        const scheduledDates = [];
        for (let i = 0; i < termMonths; i++) {
          scheduledDates.push(addMonthsPreserveDay(firstPaymentDate, i, paymentDay));
        }

        // Собираем и сортируем досрочные платежи
        const earlyList = Array.isArray(credit.earlyPayments) ? [...credit.earlyPayments] : [];
        if (extraEarlyPayment && extraEarlyPayment.amount > 0 && extraEarlyPayment.date) {
          earlyList.push({ ...extraEarlyPayment, isSimulated: true });
        }

        const validEarly = earlyList
          .filter(ep => ep && Number(ep.amount) > 0 && ep.date && ep.date >= issueDate)
          .sort((a, b) => parseDateUTC(a.date) - parseDateUTC(b.date));

        let balance = round2(amount);
        let lastDate = issueDate;
        let currentAnnuity = baseAnnuity;
        let schedIdx = 0;
        let earlyIdx = 0;

        const events = [];
        let totalInterest = 0;
        let totalPaid = 0;
        let totalEarlyPaid = 0;
        let scheduledCount = 0;

        let safetyCounter = 0;

        while (balance > 0.01 && (schedIdx < termMonths || earlyIdx < validEarly.length)) {
          safetyCounter++;
          if (safetyCounter > 800) break;

          const nextSched = schedIdx < termMonths ? scheduledDates[schedIdx] : null;
          const nextEarly = earlyIdx < validEarly.length ? validEarly[earlyIdx] : null;

          // Выбираем более раннее событие; при совпадении дат сначала досрочное погашение
          const useEarly = nextEarly && (!nextSched || nextEarly.date <= nextSched);

          if (useEarly) {
            const ep = nextEarly;
            const days = Math.max(0, diffDays(lastDate, ep.date));
            const accruedInterest = round2(balance * (rate / 100) * days / 365);
            let payAmt = round2(Number(ep.amount));
            const maxNeeded = round2(balance + accruedInterest);

            let interestPaid = 0;
            let principalPaid = 0;

            if (payAmt >= maxNeeded) {
              payAmt = maxNeeded;
              interestPaid = accruedInterest;
              principalPaid = balance;
              balance = 0;
            } else {
              // Сначала гасятся набежавшие за дни проценты, остаток уменьшает тело долга
              interestPaid = Math.min(payAmt, accruedInterest);
              principalPaid = round2(payAmt - interestPaid);
              balance = round2(Math.max(0, balance - principalPaid));
            }

            events.push({
              type: 'early',
              id: ep.id || 'sim',
              isSimulated: Boolean(ep.isSimulated),
              date: ep.date,
              mode: ep.mode || 'term',
              payment: payAmt,
              principal: principalPaid,
              interest: interestPaid,
              balance,
              days,
            });

            totalInterest = round2(totalInterest + interestPaid);
            totalPaid = round2(totalPaid + payAmt);
            totalEarlyPaid = round2(totalEarlyPaid + payAmt);
            lastDate = ep.date;

            // Если режим "Уменьшить платёж" — пересчитываем аннуитет на оставшийся срок
            if (balance > 0.01 && ep.mode === 'payment') {
              const remainingMonths = termMonths - schedIdx;
              if (remainingMonths > 0) {
                currentAnnuity = calcAnnuity(balance, rate, remainingMonths);
              }
            }

            earlyIdx++;
          } else {
            const pDate = nextSched;
            const days = Math.max(0, diffDays(lastDate, pDate));
            const accruedInterest = round2(balance * (rate / 100) * days / 365);

            let targetPayment;
            if (schedIdx === 0) {
              if (customFirst && customFirst > 0) {
                targetPayment = round2(customFirst);
              } else {
                // Автоматический расчёт неполного первого периода:
                // тело 1-го месяца + проценты за фактические дни
                const fullMonthInterest = round2(balance * (rate / 100 / 12));
                const firstMonthPrincipal = Math.max(0, round2(currentAnnuity - fullMonthInterest));
                targetPayment = round2(firstMonthPrincipal + accruedInterest);
              }
            } else if (schedIdx === termMonths - 1) {
              // Последний платёж полностью закрывает остаток тела и проценты
              targetPayment = round2(balance + accruedInterest);
            } else {
              targetPayment = currentAnnuity;
            }

            let payment = targetPayment;
            let interest = accruedInterest;
            let principal = 0;

            if (payment >= round2(balance + interest)) {
              payment = round2(balance + interest);
              principal = balance;
              balance = 0;
            } else if (payment <= interest) {
              interest = payment;
              principal = 0;
            } else {
              principal = round2(payment - interest);
              balance = round2(Math.max(0, balance - principal));
            }

            scheduledCount++;
            events.push({
              type: 'scheduled',
              index: scheduledCount,
              date: pDate,
              payment,
              principal,
              interest,
              balance,
              days,
            });

            totalInterest = round2(totalInterest + interest);
            totalPaid = round2(totalPaid + payment);
            lastDate = pDate;
            schedIdx++;
          }
        }

        const lastEvent = events.length > 0 ? events[events.length - 1] : null;

        return {
          events,
          baseAnnuity,
          finalAnnuity: currentAnnuity,
          totalInterest,
          totalPaid,
          totalEarlyPaid,
          scheduledCount,
          payoffDate: lastEvent ? lastEvent.date : firstPaymentDate,
        };
      }

      /**
       * Рассчитывает точное состояние кредита на выбранную дату asOfDate
       */
      function getCreditSnapshot(credit, asOfDate, prebuiltSchedule = null) {
        const schedule = prebuiltSchedule || buildCreditSchedule(credit);
        const events = schedule.events;

        // Если дата расчёта раньше даты выдачи
        if (asOfDate < credit.issueDate) {
          const firstSched = events.find(e => e.type === 'scheduled');
          return {
            schedule,
            isClosed: false,
            notStarted: true,
            principalBalance: round2(credit.amount),
            daysAccrued: 0,
            accruedInterest: 0,
            payoffToday: round2(credit.amount),
            monthlyPayment: firstSched ? firstSched.payment : schedule.baseAnnuity,
            nextPaymentDate: firstSched ? firstSched.date : credit.firstPaymentDate,
            nextPaymentAmount: firstSched ? firstSched.payment : schedule.baseAnnuity,
            paidPrincipal: 0,
            progressPercent: 0,
            remainingInterest: schedule.totalInterest,
          };
        }

        // Находим последнее событие на или до выбранной даты
        let lastEv = null;
        let interestAlreadyPaid = 0;
        for (let i = 0; i < events.length; i++) {
          if (events[i].date <= asOfDate) {
            lastEv = events[i];
            interestAlreadyPaid = round2(interestAlreadyPaid + events[i].interest);
          } else {
            break;
          }
        }

        const lastDate = lastEv ? lastEv.date : credit.issueDate;
        const principalBalance = lastEv ? lastEv.balance : round2(credit.amount);
        const isClosed = principalBalance <= 0.01;

        let daysAccrued = 0;
        let accruedInterest = 0;
        let payoffToday = 0;

        if (!isClosed) {
          daysAccrued = Math.max(0, diffDays(lastDate, asOfDate));
          accruedInterest = round2(principalBalance * (Number(credit.rate) / 100) * daysAccrued / 365);
          payoffToday = round2(principalBalance + accruedInterest);
        }

        // Ищем ближайший будущий плановый платёж
        const nextSched = events.find(e => e.type === 'scheduled' && e.date > asOfDate);
        // Для ежемесячного платежа в сводке берём ближайший регулярный платёж (или ближайший плановый)
        const monthlyPayment = isClosed ? 0 : (nextSched ? nextSched.payment : 0);

        const paidPrincipal = round2(Math.max(0, Number(credit.amount) - principalBalance));
        const progressPercent = Number(credit.amount) > 0
          ? Math.min(100, Math.max(0, (paidPrincipal / Number(credit.amount)) * 100))
          : 100;

        const remainingInterest = Math.max(0, round2(schedule.totalInterest - interestAlreadyPaid));

        return {
          schedule,
          isClosed,
          notStarted: false,
          principalBalance,
          daysAccrued,
          accruedInterest,
          payoffToday,
          monthlyPayment,
          nextPaymentDate: nextSched ? nextSched.date : null,
          nextPaymentAmount: nextSched ? nextSched.payment : 0,
          paidPrincipal,
          progressPercent,
          remainingInterest,
        };
      }

      // =========================================================================
      // 5. МАТЕМАТИКА KASPI RED+
      // =========================================================================

      /**
       * Генерирует даты платежей для одной покупки Kaspi Red+
       * Первый платёж — в следующем календарном месяце в день paymentDay
       */
      function getKaspiPurchaseSchedule(purchase, paymentDay) {
        const months = Math.max(1, parseInt(purchase.months, 10) || 4);
        const amount = round2(Number(purchase.amount) || 0);
        const baseMonthly = round2(amount / months);
        const dates = [];
        for (let i = 1; i <= months; i++) {
          const d = addMonthsPreserveDay(purchase.date, i, paymentDay);
          const isLast = i === months;
          const payAmt = isLast ? round2(amount - baseMonthly * (months - 1)) : baseMonthly;
          dates.push({ date: d, amount: payAmt, index: i });
        }
        return dates;
      }

      /**
       * Рассчитывает сводку по счёту Kaspi Red+ на дату asOfDate
       */
      function getKaspiRedSnapshot(item, asOfDate) {
        const limit = Number(item.limit) || 0;
        const paymentDay = Math.max(1, Math.min(28, parseInt(item.paymentDay, 10) || 15));
        const purchases = Array.isArray(item.purchases) ? item.purchases : [];

        // Определяем ближайшие 4 даты платежа строго после asOfDate
        const [ay, am, ad] = asOfDate.split('-').map(Number);
        const firstMonthOffset = ad < paymentDay ? 0 : 1;
        const baseAnchor = `${ay}-${String(am).padStart(2, '0')}-${String(Math.min(paymentDay, daysInMonth(ay, am))).padStart(2, '0')}`;

        const forecastDates = [];
        for (let i = 0; i < 4; i++) {
          forecastDates.push(addMonthsPreserveDay(baseAnchor, firstMonthOffset + i, paymentDay));
        }

        const forecastMap = {};
        forecastDates.forEach(d => { forecastMap[d] = 0; });

        let totalRemaining = 0;
        let totalOriginalActive = 0;
        let totalPaidActive = 0;

        const analyzedPurchases = purchases.map(p => {
          if (p.closedEarly) {
            return {
              ...p,
              schedule: [],
              paidCount: p.months,
              remainingCount: 0,
              monthlyPayment: 0,
              remainingAmount: 0,
              isFinished: true,
              nextDate: null,
            };
          }

          const sched = getKaspiPurchaseSchedule(p, paymentDay);
          let paidCount = 0;
          let paidSum = 0;
          let nextDate = null;

          sched.forEach(s => {
            if (s.date <= asOfDate) {
              paidCount++;
              paidSum = round2(paidSum + s.amount);
            } else {
              if (!nextDate) nextDate = s.date;
              if (forecastMap[s.date] !== undefined) {
                forecastMap[s.date] = round2(forecastMap[s.date] + s.amount);
              }
            }
          });

          const remainingCount = sched.length - paidCount;
          const remainingAmount = round2(Math.max(0, Number(p.amount) - paidSum));
          const isFinished = remainingAmount <= 0.01;
          const monthlyPayment = isFinished ? 0 : round2(Number(p.amount) / sched.length);

          if (!isFinished) {
            totalRemaining = round2(totalRemaining + remainingAmount);
            totalOriginalActive = round2(totalOriginalActive + Number(p.amount));
            totalPaidActive = round2(totalPaidActive + paidSum);
          }

          return {
            ...p,
            schedule: sched,
            paidCount,
            remainingCount,
            monthlyPayment,
            remainingAmount,
            isFinished,
            nextDate,
          };
        });

        const forecast = forecastDates.map(d => ({
          date: d,
          amount: forecastMap[d] || 0,
        }));

        const nextPaymentDate = forecast[0].amount > 0 ? forecast[0].date : (forecast.find(f => f.amount > 0)?.date || null);
        const monthlyPayment = forecast[0].amount;
        const availableLimit = Math.max(0, round2(limit - totalRemaining));
        const usedPercent = limit > 0 ? Math.min(100, (totalRemaining / limit) * 100) : 0;
        const progressPercent = totalOriginalActive > 0
          ? Math.min(100, (totalPaidActive / totalOriginalActive) * 100)
          : (totalRemaining === 0 ? 100 : 0);

        return {
          isClosed: totalRemaining <= 0.01,
          principalBalance: totalRemaining,
          accruedInterest: 0,
          payoffToday: totalRemaining,
          monthlyPayment,
          nextPaymentDate,
          limit,
          availableLimit,
          usedPercent,
          progressPercent,
          forecast,
          analyzedPurchases,
        };
      }

      // =========================================================================
      // 6. МАТЕМАТИКА РАССРОЧЕК 0% И ЛИЧНЫХ ДОЛГОВ
      // =========================================================================

      function getZeroDebtSnapshot(item, asOfDate) {
        const amount = round2(Number(item.amount) || 0);

        if (item.subType === 'installment') {
          const months = Math.max(1, parseInt(item.termMonths, 10) || 12);
          const firstDate = item.firstPaymentDate || item.startDate || getTodayStr();
          const payDay = parseInt(firstDate.split('-')[2], 10) || 1;
          const baseMonthly = round2(amount / months);

          const schedule = [];
          let paidSum = 0;
          let paidCount = 0;
          let nextEv = null;

          for (let i = 0; i < months; i++) {
            const d = addMonthsPreserveDay(firstDate, i, payDay);
            const isLast = i === months - 1;
            const payAmt = isLast ? round2(amount - baseMonthly * (months - 1)) : baseMonthly;
            const isPaid = d <= asOfDate;
            if (isPaid) {
              paidCount++;
              paidSum = round2(paidSum + payAmt);
            } else if (!nextEv) {
              nextEv = { date: d, amount: payAmt };
            }
            schedule.push({ index: i + 1, date: d, amount: payAmt, isPaid });
          }

          const remaining = round2(Math.max(0, amount - paidSum));
          const isClosed = remaining <= 0.01;
          const progressPercent = amount > 0 ? Math.min(100, (paidSum / amount) * 100) : 100;

          return {
            isClosed,
            principalBalance: remaining,
            accruedInterest: 0,
            payoffToday: remaining,
            monthlyPayment: isClosed ? 0 : (nextEv ? nextEv.amount : 0),
            nextPaymentDate: nextEv ? nextEv.date : null,
            paidSum,
            paidCount,
            totalCount: months,
            progressPercent,
            schedule,
          };
        } else {
          // Личный долг без графика
          const payments = Array.isArray(item.payments) ? item.payments : [];
          let paidSum = 0;
          payments.forEach(p => {
            if (!p.date || p.date <= asOfDate) {
              paidSum = round2(paidSum + (Number(p.amount) || 0));
            }
          });
          const remaining = round2(Math.max(0, amount - paidSum));
          const isClosed = remaining <= 0.01;
          const progressPercent = amount > 0 ? Math.min(100, (paidSum / amount) * 100) : 100;

          return {
            isClosed,
            principalBalance: remaining,
            accruedInterest: 0,
            payoffToday: remaining,
            monthlyPayment: 0,
            nextPaymentDate: null,
            paidSum,
            progressPercent,
            payments: [...payments].sort((a, b) => parseDateUTC(b.date) - parseDateUTC(a.date)),
          };
        }
      }

      /**
       * Единая функция получения снимка любого обязательства
       */
      function getItemSnapshot(item, asOfDate) {
        if (item.type === 'credit') return getCreditSnapshot(item, asOfDate);
        if (item.type === 'kaspi_red') return getKaspiRedSnapshot(item, asOfDate);
        return getZeroDebtSnapshot(item, asOfDate);
      }

      // =========================================================================
      // 8. PWA ИКОНКА (CANVAS 180x180), MANIFEST И ТЕМА
      // =========================================================================

      function generateAppIcon(size) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return '';

        // Премиальный iOS градиент (глубокий синий -> индиго)
        const grad = ctx.createLinearGradient(0, 0, size, size);
        grad.addColorStop(0, '#0A84FF');
        grad.addColorStop(0.55, '#0066FF');
        grad.addColorStop(1, '#5856D6');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        // Мягкий блик сверху
        const gloss = ctx.createRadialGradient(
          size * 0.25, size * 0.15, size * 0.05,
          size * 0.35, size * 0.25, size * 0.8
        );
        gloss.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
        gloss.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = gloss;
        ctx.fillRect(0, 0, size, size);

        // Символ тенге ₸
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `700 ${Math.round(size * 0.54)}px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif`;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
        ctx.shadowBlur = size * 0.05;
        ctx.shadowOffsetY = size * 0.025;
        ctx.fillText('₸', size / 2, size / 2 + size * 0.03);

        return canvas.toDataURL('image/png');
      }

      function setupPWA() {
        try {
          const icon180 = generateAppIcon(180);
          const icon512 = generateAppIcon(512);

          if (icon180) {
            const appleIcon = document.createElement('link');
            appleIcon.rel = 'apple-touch-icon';
            appleIcon.sizes = '180x180';
            appleIcon.href = icon180;
            document.head.appendChild(appleIcon);

            const favicon = document.createElement('link');
            favicon.rel = 'icon';
            favicon.type = 'image/png';
            favicon.href = icon180;
            document.head.appendChild(favicon);
          }

          const isDark = document.documentElement.classList.contains('dark');
          const manifest = {
            name: 'Мои долги — Трекер кредитов',
            short_name: 'Мои долги',
            description: 'Трекер кредитов, Kaspi Red+ и рассрочек в тенге',
            start_url: '.',
            display: 'standalone',
            orientation: 'portrait',
            background_color: isDark ? '#000000' : '#F2F2F7',
            theme_color: isDark ? '#000000' : '#F2F2F7',
            icons: [
              { src: icon180, sizes: '180x180', type: 'image/png', purpose: 'any maskable' },
              { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
            ]
          };

          const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
          const link = document.createElement('link');
          link.rel = 'manifest';
          link.href = URL.createObjectURL(blob);
          document.head.appendChild(link);
        } catch (e) {
          // Игнорируем в ограниченных средах
        }
      }

        const isDark = document.documentElement.classList.contains('dark');
        const meta = document.getElementById('themeColorMeta');

      function initTheme() {
        try {
          const saved = localStorage.getItem(THEME_KEY);
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
        syncThemeMeta();
      }

        const isDark = document.documentElement.classList.toggle('dark');

      let toastTimer = null;

        const el = document.getElementById('toast');
        if (!el) return;
        clearTimeout(toastTimer);
        el.textContent = msg;
        el.classList.remove('translate-y-24', 'opacity-0');
        el.classList.add('translate-y-0', 'opacity-100');
        toastTimer = setTimeout(() => {
          el.classList.remove('translate-y-0', 'opacity-100');
          el.classList.add('translate-y-24', 'opacity-0');
        }, 2200);
      }

      function copyToClipboard(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        let ok = false;
        try {
          ok = document.execCommand('copy');
        } catch (e) {
          ok = false;
        }
        document.body.removeChild(ta);
        return ok;
      }

      // =========================================================================
      // 11. РЕНДЕРИНГ ДЕТАЛЬНОГО ЭКРАНА: КРЕДИТ
      // =========================================================================

      function renderCreditDetail(item) {
        const snap = getCreditSnapshot(item, state.asOfDate);
        const sched = snap.schedule;

        // Симулятор "Что если?"
        const simAmountNum = Number(String(state.simAmount).replace(/\s+/g, '').replace(',', '.')) || 0;
        let simPreviewHtml = '';

        if (simAmountNum > 0 && state.simDate && !snap.isClosed) {
          const simSchedule = buildCreditSchedule(item, {
            date: state.simDate,
            amount: simAmountNum,
            mode: state.simMode,
          });

          const savedInterest = round2(sched.totalInterest - simSchedule.totalInterest);
          const monthsDiff = sched.scheduledCount - simSchedule.scheduledCount;

          // Находим новый ежемесячный платёж после даты досрочки
          const nextAfterSim = simSchedule.events.find(e => e.type === 'scheduled' && e.date > state.simDate);
          const oldAfterSim = sched.events.find(e => e.type === 'scheduled' && e.date > state.simDate);
          const newMonthly = nextAfterSim ? nextAfterSim.payment : 0;
          const oldMonthly = oldAfterSim ? oldAfterSim.payment : sched.finalAnnuity;

          simPreviewHtml = `
            <div class="mt-3.5 p-3.5 rounded-2xl bg-emerald-500/10 dark:bg-emerald-500/15 border border-emerald-500/20 space-y-2 animate-fade">
              <div class="text-xs font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-400">
                Что изменится
              </div>
              <div class="flex items-center justify-between text-sm tabular-nums">
                <span class="text-neutral-600 dark:text-neutral-300">Экономия на процентах</span>
                <span class="font-bold text-emerald-700 dark:text-emerald-400">${formatTenge(Math.max(0, savedInterest), { withSign: true })}</span>
              </div>
              ${state.simMode === 'term' ? `
                <div class="flex items-center justify-between text-sm tabular-nums">
                  <span class="text-neutral-600 dark:text-neutral-300">Сокращение срока</span>
                  <span class="font-bold text-neutral-900 dark:text-white">${monthsDiff > 0 ? 'на ' + pluralMonths(monthsDiff) : 'меньше 1 мес.'}</span>
                </div>
              ` : `
                <div class="flex items-center justify-between text-sm tabular-nums">
                  <span class="text-neutral-600 dark:text-neutral-300">Новый платёж</span>
                  <span class="font-bold text-neutral-900 dark:text-white">
                    ${formatTenge(newMonthly)}
                    ${oldMonthly > newMonthly ? `<span class="text-xs font-medium text-emerald-600 dark:text-emerald-400 ml-1">(−${formatTenge(oldMonthly - newMonthly, { forceInt: true })})</span>` : ''}
                  </span>
                </div>
              `}
              <div class="flex items-center justify-between text-sm tabular-nums">
                <span class="text-neutral-600 dark:text-neutral-300">Новая дата закрытия</span>
                <span class="font-semibold text-neutral-900 dark:text-white">${formatDateRu(simSchedule.payoffDate)}</span>
              </div>

              <button
                type="button"
                data-action="apply-early-payment"
                data-id="${item.id}"
                class="w-full mt-2 py-2.5 px-4 rounded-xl bg-ios-green dark:bg-ios-darkGreen text-white font-semibold text-sm shadow-sm active:scale-[0.98] transition-transform"
              >
                Применить и сохранить в график
              </button>
            </div>
          `;
        }

        // Фильтрация событий календаря
        const allEvents = sched.events;
        const nextSchedEv = allEvents.find(e => e.type === 'scheduled' && e.date > state.asOfDate);
        const visibleEvents = state.scheduleFilter === 'upcoming'
          ? allEvents.filter(e => e.date > state.asOfDate || e.type === 'early').slice(0, 24)
          : allEvents;

        return `
          <div class="safe-top safe-bottom px-4 flex-1 flex flex-col animate-view">
            <!-- Верхняя навигация -->
            <header class="flex items-center justify-between mb-4">
              <button
                type="button"
                data-action="go-home"
                class="flex items-center gap-1 text-ios-blue dark:text-ios-darkBlue font-semibold text-base py-1 -ml-1 active:opacity-60 transition-opacity"
              >
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
                <span>Назад</span>
              </button>
              <div class="flex items-center gap-2">
                <button
                  type="button"
                  data-action="edit-item"
                  data-id="${item.id}"
                  class="px-3 py-1.5 rounded-xl bg-white/90 dark:bg-ios-darkCard border border-black/5 dark:border-white/10 text-xs font-semibold text-neutral-700 dark:text-neutral-200 active:scale-95 transition-transform"
                >
                  Изменить
                </button>
                <button
                  type="button"
                  data-action="delete-item"
                  data-id="${item.id}"
                  class="px-3 py-1.5 rounded-xl bg-ios-red/10 dark:bg-ios-darkRed/15 text-xs font-semibold text-ios-red dark:text-ios-darkRed active:scale-95 transition-transform"

            <div class="mb-4">

                <span class="text-xs text-neutral-500 dark:text-neutral-400">Выдан ${formatDateRu(item.issueDate)}</span>
              </div>
              <h1 class="text-2xl font-bold tracking-tight">${escapeHtml(item.name)}</h1>
            </div>

            <!-- Карточка ежедневного расчёта на дату -->
            <section class="bg-white/95 dark:bg-ios-darkCard rounded-3xl p-5 border border-black/[0.04] dark:border-white/[0.08] shadow-sm mb-4">
              <div class="flex items-center justify-between text-xs text-neutral-500 dark:text-neutral-400 mb-1">
                <span>Закрыть полностью на ${formatDateRu(state.asOfDate)}</span>
                <span class="font-semibold text-ios-blue dark:text-ios-darkBlue">${Math.round(snap.progressPercent)}% погашено</span>
              </div>
              <div class="text-3xl font-bold tracking-tight tabular-nums text-neutral-900 dark:text-white mb-3">
                ${formatTenge(snap.payoffToday)}
              </div>

              <!-- Прогресс -->
              <div class="w-full h-2 rounded-full bg-neutral-200/80 dark:bg-ios-elevated overflow-hidden mb-4">
                <div class="h-full rounded-full bg-ios-blue dark:bg-ios-darkBlue" style="width: ${Math.round(snap.progressPercent)}%"></div>
              </div>

              <!-- Разбивка -->
              <div class="space-y-2 text-sm tabular-nums">
                <div class="flex justify-between">
                  <span class="text-neutral-500 dark:text-neutral-400">Остаток тела долга</span>
                  <span class="font-semibold">${formatTenge(snap.principalBalance)}</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-neutral-500 dark:text-neutral-400">Набежало % за ${pluralDays(snap.daysAccrued)}</span>
                  <span class="font-semibold text-amber-600 dark:text-amber-400">+${formatTenge(snap.accruedInterest)}</span>

                <div class="flex justify-between pt-2 border-t border-neutral-100 dark:border-white/5">

                  </span>
                </div>
                <div class="flex justify-between">
                  <span class="text-neutral-500 dark:text-neutral-400">Полное закрытие по графику</span>
                  <span class="font-medium">${formatDateRu(sched.payoffDate)}</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-neutral-500 dark:text-neutral-400">Осталось переплатить %</span>
                  <span class="font-medium text-neutral-700 dark:text-neutral-300">${formatTenge(snap.remainingInterest)}</span>
                </div>
              </div>
            </section>

            <!-- Симулятор «Что если?» / Досрочное погашение -->
            ${!snap.isClosed ? `
              <section class="bg-white/95 dark:bg-ios-darkCard rounded-3xl p-4 sm:p-5 border border-black/[0.04] dark:border-white/[0.08] shadow-sm mb-4">
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-base font-bold">Досрочное погашение</h2>
                  <span class="text-[11px] font-semibold px-2 py-0.5 rounded-lg bg-ios-blue/10 dark:bg-ios-darkBlue/20 text-ios-blue dark:text-ios-darkBlue">Симулятор</span>
                </div>

                <!-- Сумма досрочки -->
                <div class="mb-3">
                  <label class="block text-xs font-medium text-neutral-500 dark:text-neutral-400 mb-1.5">Сумма внесения (₸)</label>
                  <input
                    id="simAmountInput"
                    type="text"
                    inputmode="decimal"
                    placeholder="Например, 1 000 000"
                    value="${escapeHtml(state.simAmount)}"
                    class="w-full bg-ios-bg dark:bg-ios-elevated rounded-2xl px-3.5 py-2.5 text-lg font-bold tabular-nums outline-none ring-2 ring-transparent focus:ring-ios-blue/40 transition-all"
                  />
                  <!-- Быстрые чипсы -->
                  <div class="grid grid-cols-3 gap-2 mt-2">
                    <button type="button" data-action="sim-preset" data-amount="100000" class="py-1.5 rounded-xl text-xs font-semibold tabular-nums bg-ios-bg dark:bg-ios-elevated text-neutral-700 dark:text-neutral-200 active:scale-95 transition-transform">100 000</button>
                    <button type="button" data-action="sim-preset" data-amount="500000" class="py-1.5 rounded-xl text-xs font-semibold tabular-nums bg-ios-bg dark:bg-ios-elevated text-neutral-700 dark:text-neutral-200 active:scale-95 transition-transform">500 000</button>

                  </div>

                <!-- Дата досрочки -->

                  <label class="block text-xs font-medium text-neutral-500 dark:text-neutral-400 mb-1.5">Дата внесения</label>

                    data-action="sim-mode"

                    class="py-2 rounded-xl text-xs font-semibold transition-all ${state.simMode === 'term' ? 'bg-white dark:bg-ios-darkCard text-neutral-900 dark:text-white shadow-sm' : 'text-neutral-500 dark:text-neutral-400'}"
                  >

                    data-action="sim-mode"

                <h2 class="text-xs font-semibold uppercase tracking-wider text-neutral-500 dark:text-neutral-400 mb-2.5">
                  Внесённые досрочные платежи
                </h2>
                <div class="divide-y divide-neutral-100 dark:divide-white/5">
                  ${item.earlyPayments.map(ep => `
                    <div class="py-2.5 flex items-center justify-between gap-2">

                        <div class="text-sm font-bold tabular-nums text-emerald-700 dark:text-emerald-400">${formatTenge(ep.amount)}</div>

                      >

                      </button>

                  `).join('')}
                </div>
              </section>

            <!-- Платёжный календарь -->
            <section class="bg-white/95 dark:bg-ios-darkCard rounded-3xl p-4 border border-black/[0.04] dark:border-white/[0.08] shadow-sm">
              <div class="flex items-center justify-between mb-3">
                <h2 class="text-base font-bold">Платёжный календарь</h2>
                <div class="flex bg-ios-bg dark:bg-ios-elevated p-0.5 rounded-xl text-xs font-semibold">
                  <button
                    type="button"
                    data-action="schedule-filter"
                    data-val="upcoming"
                    class="px-2.5 py-1 rounded-lg transition-all ${state.scheduleFilter === 'upcoming' ? 'bg-white dark:bg-ios-darkCard text-neutral-900 dark:text-white shadow-sm' : 'text-neutral-500'}"
                  >
                    Предстоящие
                  </button>
                  <button
                    type="button"
                    data-action="schedule-filter"
                    data-val="all"
                    class="px-2.5 py-1 rounded-lg transition-all ${state.scheduleFilter === 'all' ? 'bg-white dark:bg-ios-darkCard text-neutral-900 dark:text-white shadow-sm' : 'text-neutral-500'}"
                  >
                    Весь (${allEvents.length})
                  </button>
                </div>
              </div>

              <div class="space-y-2">
                ${visibleEvents.length === 0 ? `
                  <p class="text-center text-xs text-neutral-500 py-4">Предстоящих платежей нет</p>
                ` : visibleEvents.map(ev => {
                  const isPaid = ev.date <= state.asOfDate;
                  const isNext = nextSchedEv && ev === nextSchedEv;
                  const isEarly = ev.type === 'early';

                  let rowClass = 'bg-ios-bg/60 dark:bg-ios-elevated/50 border-transparent';
                  if (isEarly) {
                    rowClass = 'bg-emerald-500/10 dark:bg-emerald-500/15 border-emerald-500/20';
                  } else if (isNext) {
                    rowClass = 'bg-ios-blue/10 dark:bg-ios-darkBlue/15 border-ios-blue/30';
                  } else if (isPaid) {
                    rowClass = 'bg-transparent opacity-60 border-neutral-100 dark:border-white/5';
                  }

                  return `
                    <div class="p-3 rounded-2xl border ${rowClass} tabular-nums">
                      <div class="flex items-center justify-between gap-2 mb-1">
                        <div class="flex items-center gap-2">
                          ${isEarly
                            ? `<span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold bg-emerald-600 text-white">Досрочно</span>`
                            : `<span class="text-xs font-bold text-neutral-500 dark:text-neutral-400">#${ev.index}</span>`
                          }
                          <span class="text-sm font-semibold">${formatDateRu(ev.date)}</span>
                          ${isNext ? `<span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold bg-ios-blue text-white">Ближайший</span>` : ''}
                          ${isPaid && !isEarly ? `<span class="text-[11px] text-emerald-600 dark:text-emerald-400 font-semibold">✓</span>` : ''}
                        </div>
                        <div class="text-sm font-bold text-neutral-900 dark:text-white">
                          ${formatTenge(ev.payment)}
                        </div>
                      </div>
                      <div class="flex items-center justify-between text-[11px] text-neutral-500 dark:text-neutral-400">
                        <span>Тело: ${formatTenge(ev.principal)} • %: ${formatTenge(ev.interest)}</span>
                        <span>Ост: ${formatTenge(ev.balance, { forceInt: true })}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          </div>
        `;
      }

            ${isInstallment ? `

      // =========================================================================
      // 14. ГЛАВНЫЙ РЕНДЕР
      // =========================================================================

      function render() {
        const root = document.getElementById('appRoot');
        if (!root) return;

        if (!state.activeItemId) {
          root.innerHTML = renderDashboard();
          bindDashboardInputs();
        } else {
          const item = state.items.find(i => i.id === state.activeItemId);
          if (!item) {
            state.activeItemId = null;
            root.innerHTML = renderDashboard();
            bindDashboardInputs();
            return;
          }
          if (item.type === 'credit') {
            root.innerHTML = renderCreditDetail(item);
            bindCreditSimInputs(item);
          } else if (item.type === 'kaspi_red') {
            root.innerHTML = renderKaspiRedDetail(item);
          } else {
            root.innerHTML = renderZeroDetail(item);
          }
        }
      }

      function bindDashboardInputs() {
        const picker = document.getElementById('globalDatePicker');
        if (picker) {
          picker.addEventListener('change', (e) => {
            if (e.target.value) {
              state.asOfDate = e.target.value;
              render();
            }
          });
        }
      }

      function bindCreditSimInputs(item) {
        const amtInput = document.getElementById('simAmountInput');
        const dateInput = document.getElementById('simDateInput');

        if (amtInput) {
          amtInput.addEventListener('input', (e) => {
            state.simAmount = e.target.value;
            updateSimPreviewOnly(item);
          });
        }
        if (dateInput) {
          dateInput.addEventListener('change', (e) => {
            if (e.target.value) {
              state.simDate = e.target.value;
              updateSimPreviewOnly(item);
            }
          });
        }
      }

      /**
       * Обновляет только блок превью симулятора без потери фокуса поля ввода
       */
      function updateSimPreviewOnly(item) {
        const container = document.getElementById('simPreviewContainer');
        if (!container) return;

        const snap = getCreditSnapshot(item, state.asOfDate);
        const sched = snap.schedule;
        const simAmountNum = Number(String(state.simAmount).replace(/\s+/g, '').replace(',', '.')) || 0;

        if (simAmountNum <= 0 || !state.simDate || snap.isClosed) {
          container.innerHTML = '';
          return;
        }

        const simSchedule = buildCreditSchedule(item, {
          date: state.simDate,
          amount: simAmountNum,
          mode: state.simMode,
        });

        const savedInterest = round2(sched.totalInterest - simSchedule.totalInterest);
        const monthsDiff = sched.scheduledCount - simSchedule.scheduledCount;
        const nextAfterSim = simSchedule.events.find(e => e.type === 'scheduled' && e.date > state.simDate);
        const oldAfterSim = sched.events.find(e => e.type === 'scheduled' && e.date > state.simDate);
        const newMonthly = nextAfterSim ? nextAfterSim.payment : 0;
        const oldMonthly = oldAfterSim ? oldAfterSim.payment : sched.finalAnnuity;

        container.innerHTML = `
          <div class="mt-3.5 p-3.5 rounded-2xl bg-emerald-500/10 dark:bg-emerald-500/15 border border-emerald-500/20 space-y-2 animate-fade">
            <div class="text-xs font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-400">
              Что изменится
            </div>
            <div class="flex items-center justify-between text-sm tabular-nums">
              <span class="text-neutral-600 dark:text-neutral-300">Экономия на процентах</span>
              <span class="font-bold text-emerald-700 dark:text-emerald-400">${formatTenge(Math.max(0, savedInterest), { withSign: true })}</span>
            </div>
            ${state.simMode === 'term' ? `
              <div class="flex items-center justify-between text-sm tabular-nums">
                <span class="text-neutral-600 dark:text-neutral-300">Сокращение срока</span>
                <span class="font-bold text-neutral-900 dark:text-white">${monthsDiff > 0 ? 'на ' + pluralMonths(monthsDiff) : 'меньше 1 мес.'}</span>
              </div>
            ` : `
              <div class="flex items-center justify-between text-sm tabular-nums">
                <span class="text-neutral-600 dark:text-neutral-300">Новый платёж</span>
                <span class="font-bold text-neutral-900 dark:text-white">
                  ${formatTenge(newMonthly)}
                  ${oldMonthly > newMonthly ? `<span class="text-xs font-medium text-emerald-600 dark:text-emerald-400 ml-1">(−${formatTenge(oldMonthly - newMonthly, { forceInt: true })})</span>` : ''}
                </span>
              </div>
            `}
            <div class="flex items-center justify-between text-sm tabular-nums">
              <span class="text-neutral-600 dark:text-neutral-300">Новая дата закрытия</span>
              <span class="font-semibold text-neutral-900 dark:text-white">${formatDateRu(simSchedule.payoffDate)}</span>
            </div>
            <button
              type="button"
              data-action="apply-early-payment"
              data-id="${item.id}"
              class="w-full mt-2 py-2.5 px-4 rounded-xl bg-ios-green dark:bg-ios-darkGreen text-white font-semibold text-sm shadow-sm active:scale-[0.98] transition-transform"
            >
              Применить и сохранить в график
            </button>
          </div>
        `;
      }

      // =========================================================================
      // 15. МОДАЛЬНЫЕ ОКНА (ДОБАВЛЕНИЕ, РЕДАКТИРОВАНИЕ, НАСТРОЙКИ, ПОДТВЕРЖДЕНИЕ)
      // =========================================================================

      function openModal(html) {
        const box = document.getElementById('modalContainer');
        box.innerHTML = `
          <div class="fixed inset-0 bg-black/50 backdrop-blur-xs animate-fade" data-action="close-modal"></div>
          <div class="fixed inset-x-0 bottom-0 sm:inset-0 sm:flex sm:items-center sm:justify-center pointer-events-none p-0 sm:p-4">
            <div class="pointer-events-auto w-full sm:max-w-md bg-white dark:bg-ios-darkCard rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90dvh] overflow-y-auto safe-modal-bottom animate-slide-up">
              ${html}
            </div>
          </div>
        `;
        box.classList.remove('hidden');
      }

      function closeModal() {
        const box = document.getElementById('modalContainer');
        box.classList.add('hidden');
        box.innerHTML = '';
      }

      function openConfirmModal(title, message, confirmLabel, onConfirm) {
        openModal(`
          <div class="p-5">
            <h3 class="text-lg font-bold mb-1.5">${escapeHtml(title)}</h3>
            <p class="text-sm text-neutral-500 dark:text-neutral-400 mb-5">${escapeHtml(message)}</p>
            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" data-action="close-modal" class="py-3 rounded-2xl bg-ios-bg dark:bg-ios-elevated font-semibold text-sm">Отмена</button>
              <button type="button" id="confirmModalActionBtn" class="py-3 rounded-2xl bg-ios-red dark:bg-ios-darkRed text-white font-semibold text-sm">${escapeHtml(confirmLabel)}</button>
            </div>
          </div>
        `);
        document.getElementById('confirmModalActionBtn').addEventListener('click', () => {
          closeModal();
          onConfirm();
        });
      }

                </p>

            `;
          }

          if (type === 'kaspi_red') {
            return `
              <div class="space-y-3">
                <div>
                  <label class="block text-xs font-semibold text-neutral-500 dark:text-neutral-400 mb-1">Название</label>
                  <input name="name" required value="${escapeHtml(existingItem?.name || 'Kaspi Red+')}" class="w-full bg-ios-bg dark:bg-ios-elevated rounded-2xl px-3.5 py-2.5 text-sm font-medium outline-none" />
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                  <div>
                    <label class="block text-xs font-semibold text-neutral-500 dark:text-neutral-400 mb-1">Общий лимит (₸)</label>
                    <input name="limit" type="number" value="${existingItem?.limit || 500000}" placeholder="500000" class="w-full bg-ios-bg dark:bg-ios-elevated rounded-2xl px-3.5 py-2.5 text-sm font-bold tabular-nums outline-none" />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-neutral-500 dark:text-neutral-400 mb-1">День платежа (1–28)</label>
                    <input name="paymentDay" type="number" min="1" max="28" required value="${existingItem?.paymentDay || 15}" class="w-full bg-ios-bg dark:bg-ios-elevated rounded-2xl px-3.5 py-2.5 text-sm font-bold tabular-nums outline-none" />
                  </div>
                </div>
              </div>
            `;
          }

          // type === 'zero'
          return `
            <div class="space-y-3">
              <div class="grid grid-cols-2 p-1 rounded-2xl bg-ios-bg dark:bg-ios-elevated">
                <label class="text-center py-1.5 rounded-xl text-xs font-semibold cursor-pointer has-[:checked]:bg-white dark:has-[:checked]:bg-ios-darkCard has-[:checked]:shadow-sm">
                  <input type="radio" name="subType" value="installment" class="hidden" ${subType === 'installment' ? 'checked' : ''} />
                  Рассрочка 0%
                </label>
                <label class="text-center py-1.5 rounded-xl text-xs font-semibold cursor-pointer has-[:checked]:bg-white dark:has-[:checked]:bg-ios-darkCard has-[:checked]:shadow-sm">
                  <input type="radio" name="subType" value="personal" class="hidden" ${subType === 'personal' ? 'checked' : ''} />
                  Личный долг
                </label>
              </div>
              <div>
                <label class="block text-xs font-semibold text-neutral-500 dark:text-neutral-400 mb-1">Название / Кому должен</label>
                <input name="name" required value="${escapeHtml(existingItem?.name || '')}" placeholder="Например, Телефон 0-0-12 или Арман" class="w-full bg-ios-bg dark:bg-ios-elevated rounded-2xl px-3.5 py-2.5 text-sm font-medium outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-neutral-500 dark:text-neutral-400 mb-1">Общая сумма (₸)</label>
                <input name="amount" type="number" step="0.01" required value="${existingItem?.amount || ''}" placeholder="120000" class="w-full bg-ios-bg dark:bg-ios-elevated rounded-2xl px-3.5 py-2.5 text-sm font-bold tabular-nums outline-none" />
              </div>
              <div id="installmentOnlyFields" class="grid grid-cols-2 gap-2.5 ${subType === 'personal' ? 'hidden' : ''}">
                <div>
                  <label class="block text-xs font-semibold text-neutral-500 dark:text-neutral-400 mb-1">Срок (месяцев)</label>
                  <input name="termMonths" type="number" min="1" max="120" value="${existingItem?.termMonths || 12}" class="w-full bg-ios-bg dark:bg-ios-elevated rounded-2xl px-3.5 py-2.5 text-sm font-bold tabular-nums outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-neutral-500 dark:text-neutral-400 mb-1">Дата 1-го платежа</label>
                  <input name="firstPaymentDate" type="date" value="${existingItem?.firstPaymentDate || nextMonth}" class="w-full bg-ios-bg dark:bg-ios-elevated rounded-2xl px-3 py-2 text-sm font-semibold outline-none" />
                </div>
              </div>
            </div>
          `;
        };

        openModal(`
          <div class="p-5">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-bold">${isEdit ? 'Редактировать' : 'Новое обязательство'}</h3>
              <button type="button" data-action="close-modal" class="w-8 h-8 rounded-full bg-ios-bg dark:bg-ios-elevated flex items-center justify-center text-neutral-500">✕</button>
            </div>

            ${!isEdit ? `
              <div class="grid grid-cols-3 gap-1 p-1 rounded-2xl bg-ios-bg dark:bg-ios-elevated mb-4">
                <button type="button" data-switch-type="credit" class="py-2 rounded-xl text-xs font-semibold transition-all ${type === 'credit' ? 'bg-white dark:bg-ios-darkCard shadow-sm text-neutral-900 dark:text-white' : 'text-neutral-500'}">Кредит</button>
                <button type="button" data-switch-type="kaspi_red" class="py-2 rounded-xl text-xs font-semibold transition-all ${type === 'kaspi_red' ? 'bg-white dark:bg-ios-darkCard shadow-sm text-neutral-900 dark:text-white' : 'text-neutral-500'}">Kaspi Red+</button>
                <button type="button" data-switch-type="zero" class="py-2 rounded-xl text-xs font-semibold transition-all ${type === 'zero' ? 'bg-white dark:bg-ios-darkCard shadow-sm text-neutral-900 dark:text-white' : 'text-neutral-500'}">0% / Долг</button>
              </div>
            ` : ''}

            <form id="itemForm" class="space-y-4">
              ${formFields()}
              <button type="submit" class="w-full py-3.5 rounded-2xl bg-ios-blue dark:bg-ios-darkBlue text-white font-semibold text-sm shadow-sm active:scale-[0.98] transition-transform">
                ${isEdit ? 'Сохранить изменения' : 'Добавить'}
              </button>
            </form>
          </div>
        `);

        // Переключение типа при создании
        document.querySelectorAll('[data-switch-type]').forEach(btn => {
          btn.addEventListener('click', () => {
            openItemFormModal(null, btn.getAttribute('data-switch-type'));
          });
        });

        // Переключение подтипа Рассрочка / Личный долг
        document.querySelectorAll('input[name="subType"]').forEach(radio => {
          radio.addEventListener('change', (e) => {
            const box = document.getElementById('installmentOnlyFields');
            if (box) box.classList.toggle('hidden', e.target.value === 'personal');
          });
        });

        // Сохранение формы
        document.getElementById('itemForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);

          if (type === 'credit') {
            const amount = Number(fd.get('amount'));
            const rate = Number(fd.get('rate'));
            const termMonths = parseInt(fd.get('termMonths'), 10);
            const issueDate = fd.get('issueDate');
            const firstPaymentDate = fd.get('firstPaymentDate');
            const customFirstRaw = fd.get('customFirstPayment');
            const customFirstPayment = customFirstRaw ? Number(customFirstRaw) : null;

            if (firstPaymentDate < issueDate) {
              showToast('Дата 1-го платежа не может быть раньше выдачи');
              return;
            }

            const payload = {
              id: existingItem ? existingItem.id : generateId(),
              type: 'credit',
              name: String(fd.get('name')).trim() || 'Кредит',
              amount,
              rate,
              termMonths,
              issueDate,
              firstPaymentDate,
              customFirstPayment,
              earlyPayments: existingItem?.earlyPayments || [],
            };

            upsertItem(payload);
          } else if (type === 'kaspi_red') {
            const payload = {
              id: existingItem ? existingItem.id : generateId(),
              type: 'kaspi_red',
              name: String(fd.get('name')).trim() || 'Kaspi Red+',
              limit: Number(fd.get('limit')) || 0,
              paymentDay: Math.max(1, Math.min(28, parseInt(fd.get('paymentDay'), 10) || 15)),
              purchases: existingItem?.purchases || [],
            };
            upsertItem(payload);
          } else {
            const chosenSub = fd.get('subType') || 'installment';
            const payload = {
              id: existingItem ? existingItem.id : generateId(),
              type: 'zero',
              subType: chosenSub,
              name: String(fd.get('name')).trim() || 'Долг',
              amount: Number(fd.get('amount')) || 0,
              termMonths: parseInt(fd.get('termMonths'), 10) || 12,
              firstPaymentDate: fd.get('firstPaymentDate') || nextMonth,
              payments: existingItem?.payments || [],
            };
            upsertItem(payload);
          }

          closeModal();
          render();
          showToast(isEdit ? 'Изменения сохранены' : 'Добавлено');
        });
      }

      function upsertItem(payload) {
        const idx = state.items.findIndex(i => i.id === payload.id);
        if (idx >= 0) {
          state.items[idx] = payload;
        } else {
          state.items.unshift(payload);
        }
        saveItems(state.items);
      }

      /**
       * Модальное окно настроек: Экспорт / Импорт JSON и сброс к примеру
       */
      function openSettingsModal() {
        const jsonExport = JSON.stringify(state.items, null, 2);

        openModal(`
          <div class="p-5">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-bold">Настройки и данные</h3>
              <button type="button" data-action="close-modal" class="w-8 h-8 rounded-full bg-ios-bg dark:bg-ios-elevated flex items-center justify-center text-neutral-500">✕</button>
            </div>

            <div class="space-y-4">
              <div class="p-3.5 rounded-2xl bg-ios-bg dark:bg-ios-elevated space-y-2.5">
                <div class="text-xs font-bold uppercase tracking-wider text-neutral-500 dark:text-neutral-400">Резервная копия (JSON)</div>
                <p class="text-xs text-neutral-500 dark:text-neutral-400">
                  Сохраняйте копию, чтобы не потерять записи при очистке кэша Safari.
                </p>
                <div class="grid grid-cols-2 gap-2">
                  <button type="button" id="copyJsonBtn" class="py-2.5 rounded-xl bg-white dark:bg-ios-darkCard text-xs font-semibold shadow-sm active:scale-95 transition-transform">
                    Скопировать JSON
                  </button>
                  <button type="button" id="downloadJsonBtn" class="py-2.5 rounded-xl bg-ios-blue dark:bg-ios-darkBlue text-white text-xs font-semibold shadow-sm active:scale-95 transition-transform">
                    Скачать файл
                  </button>
                </div>
              </div>

              <div class="p-3.5 rounded-2xl bg-ios-bg dark:bg-ios-elevated space-y-2.5">
                <div class="text-xs font-bold uppercase tracking-wider text-neutral-500 dark:text-neutral-400">Импорт из JSON</div>
                <textarea
                  id="importJsonInput"
                  rows="3"
                  placeholder="Вставьте сюда ранее скопированный JSON..."
                  class="w-full bg-white dark:bg-ios-darkCard rounded-xl p-2.5 text-xs font-mono outline-none"
                ></textarea>
                <div class="grid grid-cols-2 gap-2">
                  <button type="button" id="importJsonBtn" class="py-2.5 rounded-xl bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 text-xs font-semibold active:scale-95 transition-transform">
                    Загрузить текст
                  </button>
                  <label class="py-2.5 rounded-xl bg-white dark:bg-ios-darkCard text-xs font-semibold text-center cursor-pointer shadow-sm active:scale-95 transition-transform">
                    Выбрать файл
                    <input type="file" id="importFileInput" accept=".json,application/json" class="hidden" />
                  </label>
                </div>
              </div>

              <button
                type="button"
                id="resetDefaultsBtn"
                class="w-full py-3 rounded-2xl bg-ios-red/10 dark:bg-ios-darkRed/15 text-ios-red dark:text-ios-darkRed font-semibold text-sm active:scale-[0.98] transition-transform"
              >
                Сбросить к предустановленному примеру
              </button>
            </div>
          </div>
        `);

        document.getElementById('copyJsonBtn').addEventListener('click', () => {
          if (copyToClipboard(jsonExport)) {
            showToast('JSON скопирован в буфер');
          } else {
            showToast('Не удалось скопировать');
          }
        });

        document.getElementById('downloadJsonBtn').addEventListener('click', () => {
          const blob = new Blob([jsonExport], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `my-debts-${getTodayStr()}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Файл скачан');
        });

        const applyImportedText = (rawText) => {
          try {
            const parsed = JSON.parse(rawText);
            if (!Array.isArray(parsed)) throw new Error('Invalid format');
            state.items = parsed;
            state.activeItemId = null;
            saveItems(state.items);
            closeModal();
            render();
            showToast('Данные успешно импортированы');
          } catch (err) {
            showToast('Ошибка: некорректный JSON');
          }
        };

        document.getElementById('importJsonBtn').addEventListener('click', () => {
          const val = document.getElementById('importJsonInput').value.trim();
          if (!val) {
            showToast('Вставьте JSON в поле');
            return;
          }
          applyImportedText(val);
        });

        document.getElementById('importFileInput').addEventListener('change', (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => applyImportedText(String(reader.result || ''));
          reader.readAsText(file);
        });

        document.getElementById('resetDefaultsBtn').addEventListener('click', () => {
          openConfirmModal(
            'Сбросить все данные?',
            'Текущий список будет заменён на предустановленный пример (Основной кредит и Kaspi Red+).',
            'Сбросить',
            () => {
              state.items = createDefaultData();
              state.activeItemId = null;
              state.asOfDate = getTodayStr();
              saveItems(state.items);
              render();
              showToast('Сброшено к примеру');
            }
          );
        });
      }

      // =========================================================================
      // 16. ДЕЛЕГИРОВАНИЕ СОБЫТИЙ
      // =========================================================================

      document.addEventListener('click', (e) => {
        const target = e.target.closest('[data-action]');
        if (!target) return;
        const action = target.getAttribute('data-action');

        switch (action) {
          case 'toggle-theme':
            toggleTheme();
            break;

          case 'open-settings':
            openSettingsModal();
            break;

          case 'close-modal':
            closeModal();
            break;

          case 'reset-date-today':
            state.asOfDate = getTodayStr();
            render();
            break;

          case 'set-filter':
            state.filter = target.getAttribute('data-filter');
            render();
            break;

          case 'open-add-modal':
            openItemFormModal(null, 'credit');
            break;

          case 'open-item':
            state.activeItemId = target.getAttribute('data-id');
            state.simAmount = '';
            state.simDate = state.asOfDate;
            state.simMode = 'term';
            state.scheduleFilter = 'upcoming';
            window.scrollTo({ top: 0, behavior: 'instant' });
            render();
            break;

          case 'go-home':
            state.activeItemId = null;
            window.scrollTo({ top: 0, behavior: 'instant' });
            render();
            break;

          case 'edit-item': {
            const id = target.getAttribute('data-id');
            const item = state.items.find(i => i.id === id);
            if (item) openItemFormModal(item);
            break;
          }

          case 'delete-item': {
            const id = target.getAttribute('data-id');
            const item = state.items.find(i => i.id === id);
            if (!item) return;
            openConfirmModal(
              'Удалить обязательство?',
              `«${item.name}» будет удалено без возможности восстановления.`,
              'Удалить',
              () => {
                state.items = state.items.filter(i => i.id !== id);
                state.activeItemId = null;
                saveItems(state.items);
                render();
                showToast('Удалено');
              }
            );
            break;
          }

          case 'sim-preset': {
            const amt = target.getAttribute('data-amount');
            state.simAmount = amt;
            const input = document.getElementById('simAmountInput');
            if (input) input.value = amt;
            const item = state.items.find(i => i.id === state.activeItemId);
            if (item) updateSimPreviewOnly(item);
            break;
          }

          case 'sim-mode': {
            state.simMode = target.getAttribute('data-mode');
            render();
            break;
          }

          case 'apply-early-payment': {
            const id = target.getAttribute('data-id');
            const item = state.items.find(i => i.id === id);
            const amt = Number(String(state.simAmount).replace(/\s+/g, '').replace(',', '.')) || 0;
            if (!item || amt <= 0 || !state.simDate) return;

            if (!Array.isArray(item.earlyPayments)) item.earlyPayments = [];
            item.earlyPayments.push({
              id: generateId(),
              date: state.simDate,
              amount: round2(amt),
              mode: state.simMode,
            });
            saveItems(state.items);
            state.simAmount = '';
            render();
            showToast('Досрочное погашение сохранено');
            break;
          }

          case 'remove-early-payment': {
            const itemId = target.getAttribute('data-item-id');
            const epId = target.getAttribute('data-ep-id');
            const item = state.items.find(i => i.id === itemId);
            if (!item || !Array.isArray(item.earlyPayments)) return;
            item.earlyPayments = item.earlyPayments.filter(ep => ep.id !== epId);
            saveItems(state.items);
            render();
            showToast('Досрочный платёж удалён');
            break;
          }

          case 'schedule-filter':
            state.scheduleFilter = target.getAttribute('data-val');
            render();
            break;

          case 'open-add-purchase':
            openAddPurchaseModal(target.getAttribute('data-id'));
            break;

          case 'close-purchase-early': {
            const itemId = target.getAttribute('data-item-id');
            const pId = target.getAttribute('data-purchase-id');
            const item = state.items.find(i => i.id === itemId);
            const p = item?.purchases?.find(x => x.id === pId);
            if (!p) return;
            p.closedEarly = true;
            saveItems(state.items);
            render();
            showToast('Покупка закрыта досрочно');
            break;
          }

          case 'delete-purchase': {
            const itemId = target.getAttribute('data-item-id');
            const pId = target.getAttribute('data-purchase-id');
            const item = state.items.find(i => i.id === itemId);
            if (!item || !Array.isArray(item.purchases)) return;
            item.purchases = item.purchases.filter(x => x.id !== pId);
            saveItems(state.items);
            render();
            showToast('Покупка удалена');
            break;
          }

          case 'open-add-return':
            openAddReturnModal(target.getAttribute('data-id'));
            break;

          case 'delete-return': {
            const itemId = target.getAttribute('data-item-id');
            const payId = target.getAttribute('data-pay-id');
            const item = state.items.find(i => i.id === itemId);
            if (!item || !Array.isArray(item.payments)) return;
            item.payments = item.payments.filter(x => x.id !== payId);
            saveItems(state.items);
            render();
            showToast('Запись удалена');
            break;
          }
        }
      });

      // =========================================================================
      // 17. ЗАПУСК ПРИЛОЖЕНИЯ
      // =========================================================================
      initTheme();
      setupPWA();
      render();
    })();
  </script>
</body>
</html>
